<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>直播拉流管理 | SODA567 Admin</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚙️</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@200;300;400&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --bg: #0a0a0a; --surface: #141414; --surface-soft: rgba(255,255,255,0.03);
  --gold: #ffd700; --text: #e8e8e8; --muted: #666; --border: #222;
  --success: #5ad060; --danger: #ff6b6b;
}
body { background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; font-weight: 200; min-height: 100vh; }

nav {
  display: flex; justify-content: space-between; align-items: center;
  padding: 24px 48px; border-bottom: 1px solid var(--border);
}
.logo { font-size: 1.2rem; color: var(--text); font-weight: 300; text-decoration: none; letter-spacing: 1px; }
.nav-back {
  padding: 10px 20px; border-radius: 6px; text-decoration: none;
  font-size: 0.85rem; font-weight: 300; letter-spacing: 1px;
  transition: all 0.3s; cursor: pointer;
  border: 1px solid rgba(255,255,255,0.2); color: var(--text);
}
.nav-back:hover { border-color: var(--gold); color: var(--gold); }

.container { max-width: 960px; margin: 0 auto; padding: 48px 48px 96px; }
.page-title { font-size: clamp(1.6rem, 3vw, 2.4rem); font-weight: 200; letter-spacing: -1px; margin-bottom: 32px; }

/* ── Tabs ── */
.tabs {
  display: flex; gap: 0; border-bottom: 1px solid var(--border); margin-bottom: 32px;
}
.tab {
  padding: 12px 24px; cursor: pointer; font-size: 0.88rem; font-weight: 300;
  color: var(--muted); border-bottom: 2px solid transparent;
  transition: all 0.3s; font-family: 'DM Sans', sans-serif;
  background: none; border-top: none; border-left: none; border-right: none;
}
.tab:hover { color: var(--text); }
.tab.active { color: var(--gold); border-bottom-color: var(--gold); }

.tab-content { display: none; }
.tab-content.active { display: block; }

/* ── Stats Cards ── */
.stats-grid {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 16px; margin-bottom: 32px;
}
.stat-card {
  background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
  padding: 24px; text-align: center;
}
.stat-value { font-size: 2rem; font-weight: 300; color: var(--gold); margin-bottom: 4px; }
.stat-label { font-size: 0.8rem; color: var(--muted); letter-spacing: 1px; }

/* ── Chart placeholder ── */
.chart-box {
  background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
  padding: 24px; margin-bottom: 24px;
}
.chart-title { font-size: 0.85rem; color: var(--muted); margin-bottom: 16px; letter-spacing: 1px; }
.bar-chart { display: flex; flex-direction: column; gap: 10px; }
.bar-row { display: flex; align-items: center; gap: 12px; }
.bar-label { min-width: 70px; font-size: 0.82rem; color: var(--muted); text-align: right; }
.bar-track { flex: 1; height: 24px; background: rgba(255,255,255,0.04); border-radius: 4px; overflow: hidden; }
.bar-fill { height: 100%; background: linear-gradient(90deg, var(--gold), rgba(255,215,0,0.6)); border-radius: 4px; transition: width 0.5s; min-width: 2px; }
.bar-value { min-width: 30px; font-size: 0.82rem; color: var(--text); }

/* ── Cookie Cards ── */
.cookie-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 16px;
}
.cookie-card {
  background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
  padding: 20px; transition: border-color 0.3s;
}
.cookie-card:hover { border-color: rgba(255,255,255,0.15); }
.cookie-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.cookie-name { font-size: 1rem; font-weight: 300; }
.cookie-status {
  padding: 3px 10px; border-radius: 12px; font-size: 0.72rem;
  letter-spacing: 0.5px;
}
.cookie-status.ok { background: rgba(90,208,96,0.1); color: var(--success); border: 1px solid rgba(90,208,96,0.3); }
.cookie-status.missing { background: rgba(255,100,100,0.1); color: var(--danger); border: 1px solid rgba(255,100,100,0.3); }
.cookie-updated { font-size: 0.75rem; color: var(--muted); margin-bottom: 12px; }
.cookie-input {
  width: 100%; padding: 10px 12px; border-radius: 6px;
  border: 1px solid var(--border); background: #101010; color: var(--text);
  font-size: 0.82rem; font-family: monospace; resize: vertical; min-height: 60px;
  margin-bottom: 10px; transition: border-color 0.3s;
}
.cookie-input:focus { outline: none; border-color: var(--gold); }
.cookie-actions { display: flex; gap: 8px; }

/* ── Log Table ── */
.log-table-wrap {
  background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
  overflow: hidden;
}
.log-table {
  width: 100%; border-collapse: collapse;
}
.log-table th, .log-table td {
  padding: 10px 14px; text-align: left; font-size: 0.82rem;
  border-bottom: 1px solid var(--border);
}
.log-table th {
  color: var(--muted); font-weight: 300; letter-spacing: 1px; text-transform: uppercase;
  font-size: 0.72rem; background: rgba(255,255,255,0.02);
}
.log-table td { color: var(--text); font-weight: 300; }
.log-table tr:last-child td { border-bottom: none; }
.log-table .success { color: var(--success); }
.log-table .fail { color: var(--danger); }
.log-table .url-cell { max-width: 300px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ── Buttons ── */
.btn {
  padding: 10px 20px; border-radius: 6px; text-decoration: none;
  font-weight: 300; font-size: 0.82rem; transition: all 0.3s;
  cursor: pointer; border: none; font-family: 'DM Sans', sans-serif;
}
.btn-primary { background: var(--gold); color: var(--bg); }
.btn-primary:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(255,215,0,0.25); }
.btn-danger { background: rgba(255,80,80,0.1); color: var(--danger); border: 1px solid rgba(255,80,80,0.3); }
.btn-danger:hover { background: rgba(255,80,80,0.2); }
.btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); }
.btn-ghost:hover { color: var(--text); border-color: rgba(255,255,255,0.3); }
.btn:disabled { opacity: .5; cursor: not-allowed; }

/* ── Toast ── */
.toast {
  position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(80px);
  background: var(--surface); border: 1px solid var(--border);
  padding: 12px 24px; border-radius: 8px; font-size: 0.88rem;
  color: var(--text); z-index: 9999; transition: transform 0.3s; pointer-events: none;
}
.toast.show { transform: translateX(-50%) translateY(0); }
.toast.error { border-color: var(--danger); color: var(--danger); }

/* ── Responsive ── */
@media (max-width: 768px) {
  nav, .container { padding-left: 20px; padding-right: 20px; }
  .stats-grid { grid-template-columns: 1fr 1fr; }
  .cookie-grid { grid-template-columns: 1fr; }
  .tabs { overflow-x: auto; }
}
</style>
</head>
<body>

<nav>
  <a href="../index.html" class="logo" style="display:flex;align-items:center;gap:8px;text-decoration:none;line-height:1;">
    <img src="../images/logo-icon.png" style="height:48px;width:auto;border-radius:4px;">
    <div style="display:flex;flex-direction:column;justify-content:center;">
      <span style="font-weight:700;font-family:'DM Sans',sans-serif;letter-spacing:-0.5px;color:#fff;font-size:1.2em;">soda</span>
      <span style="font-weight:200;font-family:'DM Sans',sans-serif;letter-spacing:3.5px;font-size:0.65em;opacity:0.8;color:#fff;margin-top:2px;">MEDIA</span>
    </div>
  </a>
  <a href="live-source.html" class="nav-back">← 返回工具</a>
</nav>

<div class="container">
  <h1 class="page-title">⚙️ 直播拉流管理</h1>

  <!-- Tabs -->
  <div class="tabs">
    <button class="tab active" onclick="switchTab('stats')">📊 统计</button>
    <button class="tab" onclick="switchTab('cookies')">🍪 Cookie</button>
    <button class="tab" onclick="switchTab('logs')">📋 日志</button>
  </div>

  <!-- ═══ Stats Tab ═══ -->
  <div class="tab-content active" id="tab-stats">
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-value" id="statTotal">-</div>
        <div class="stat-label">今日解析次数</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="statSuccess">-</div>
        <div class="stat-label">成功次数</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="statRate">-</div>
        <div class="stat-label">成功率</div>
      </div>
    </div>
    <div class="chart-box">
      <div class="chart-title">平台分布</div>
      <div class="bar-chart" id="platformChart"></div>
    </div>
  </div>

  <!-- ═══ Cookies Tab ═══ -->
  <div class="tab-content" id="tab-cookies">
    <div class="cookie-grid" id="cookieGrid"></div>
  </div>

  <!-- ═══ Logs Tab ═══ -->
  <div class="tab-content" id="tab-logs">
    <div class="log-table-wrap">
      <table class="log-table">
        <thead>
          <tr>
            <th>时间</th>
            <th>平台</th>
            <th>结果</th>
            <th>链接</th>
            <th>错误</th>
          </tr>
        </thead>
        <tbody id="logBody"></tbody>
      </table>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const API = '/api/live-source';

// ── Tabs ──
function switchTab(name) {
  document.querySelectorAll('.tab').forEach((t, i) => {
    t.classList.toggle('active', t.textContent.includes(
      name === 'stats' ? '统计' : name === 'cookies' ? 'Cookie' : '日志'
    ));
  });
  document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
  document.getElementById(`tab-${name}`).classList.add('active');
  if (name === 'stats') loadStats();
  if (name === 'cookies') loadCookies();
  if (name === 'logs') loadLogs();
}

// ── Stats ──
async function loadStats() {
  try {
    const r = await fetch(`${API}/admin/stats`);
    const d = await r.json();
    document.getElementById('statTotal').textContent = d.today_total ?? '-';
    document.getElementById('statSuccess').textContent = d.today_success ?? '-';
    document.getElementById('statRate').textContent = d.today_rate ?? '-';

    // Bar chart
    const dist = d.platform_distribution || {};
    const maxVal = Math.max(...Object.values(dist), 1);
    const names = { douyin: '抖音', kuaishou: '快手', bilibili: 'B站', taobao: '淘宝', jd: '京东', xiaohongshu: '小红书', unknown: '未知' };
    const chart = document.getElementById('platformChart');
    chart.innerHTML = '';
    for (const [k, v] of Object.entries(dist)) {
      const pct = (v / maxVal) * 100;
      chart.innerHTML += `
        <div class="bar-row">
          <span class="bar-label">${names[k] || k}</span>
          <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>
          <span class="bar-value">${v}</span>
        </div>`;
    }
    if (!Object.keys(dist).length) {
      chart.innerHTML = '<div style="color:var(--muted);font-size:0.85rem;">暂无数据</div>';
    }
  } catch { document.getElementById('platformChart').innerHTML = '<div style="color:var(--muted)">加载失败</div>'; }
}

// ── Cookies ──
const PLATFORM_INFO = {
  douyin: { name: '抖音', icon: '🎵' },
  kuaishou: { name: '快手', icon: '⚡' },
  bilibili: { name: 'B站', icon: '📺' },
  taobao: { name: '淘宝', icon: '🛒' },
  jd: { name: '京东', icon: '🐕' },
  xiaohongshu: { name: '小红书', icon: '📕' },
};

async function loadCookies() {
  try {
    const r = await fetch(`${API}/admin/cookies`);
    const d = await r.json();
    const grid = document.getElementById('cookieGrid');
    grid.innerHTML = '';

    for (const [k, info] of Object.entries(d)) {
      const pi = PLATFORM_INFO[k] || { name: k, icon: '❓' };
      const statusCls = info.has_cookie ? 'ok' : 'missing';
      const statusText = info.has_cookie ? '已配置' : '未配置';
      const updated = info.updated_at ? new Date(info.updated_at).toLocaleString('zh-CN') : '—';

      grid.innerHTML += `
        <div class="cookie-card">
          <div class="cookie-head">
            <span class="cookie-name">${pi.icon} ${pi.name}</span>
            <span class="cookie-status ${statusCls}">${statusText}</span>
          </div>
          <div class="cookie-updated">更新时间: ${updated}</div>
          <textarea class="cookie-input" id="cookie-${k}" placeholder="粘贴 Cookie 字符串..."></textarea>
          <div class="cookie-actions">
            <button class="btn btn-primary" onclick="saveCookie('${k}')">保存</button>
            <button class="btn btn-danger" onclick="deleteCookie('${k}')">删除</button>
          </div>
        </div>`;
    }
  } catch { document.getElementById('cookieGrid').innerHTML = '<div style="color:var(--muted)">加载失败</div>'; }
}

async function saveCookie(platform) {
  const cookie = document.getElementById(`cookie-${platform}`).value.trim();
  if (!cookie) { showToast('请输入 Cookie', true); return; }
  try {
    const r = await fetch(`${API}/admin/cookie`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ platform, cookie }),
    });
    if (r.ok) { showToast('Cookie 已保存'); loadCookies(); }
    else showToast('保存失败', true);
  } catch { showToast('网络错误', true); }
}

async function deleteCookie(platform) {
  if (!confirm('确认删除该平台 Cookie？')) return;
  try {
    const r = await fetch(`${API}/admin/cookie`, {
      method: 'DELETE',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ platform }),
    });
    if (r.ok) { showToast('Cookie 已删除'); loadCookies(); }
  } catch { showToast('网络错误', true); }
}

// ── Logs ──
async function loadLogs() {
  try {
    const r = await fetch(`${API}/admin/stats`);
    const d = await r.json();
    const logs = (d.recent_logs || []).reverse();
    const names = { douyin: '抖音', kuaishou: '快手', bilibili: 'B站', taobao: '淘宝', jd: '京东', xiaohongshu: '小红书' };
    const tbody = document.getElementById('logBody');
    tbody.innerHTML = '';
    for (const l of logs) {
      const t = l.time ? new Date(l.time).toLocaleString('zh-CN') : '-';
      const p = names[l.platform] || l.platform || '-';
      const s = l.success ? '<span class="success">✓ 成功</span>' : '<span class="fail">✗ 失败</span>';
      const u = l.url ? `<span class="url-cell" title="${esc(l.url)}">${esc(l.url)}</span>` : '-';
      const e = l.error ? `<span style="color:var(--danger);font-size:0.78rem;">${esc(l.error)}</span>` : '-';
      tbody.innerHTML += `<tr><td>${t}</td><td>${p}</td><td>${s}</td><td>${u}</td><td>${e}</td></tr>`;
    }
    if (!logs.length) tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:var(--muted);padding:24px;">暂无记录</td></tr>';
  } catch { document.getElementById('logBody').innerHTML = '<tr><td colspan="5" style="text-align:center;color:var(--muted)">加载失败</td></tr>'; }
}

function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function showToast(msg, isError) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = isError ? 'toast error show' : 'toast show';
  setTimeout(() => t.classList.remove('show'), 2500);
}

// ── Init ──
loadStats();
</script>
</body>
</html>
